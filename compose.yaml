services:
  postgres:
    image: postgres:16-alpine
    container_name: nexaops-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nexaops_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_password
    volumes:
      - nexaops_postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:8.0
    container_name: nexaops-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: local_password
    volumes:
      - nexaops_mongodb_data:/data/db

volumes:
  nexaops_postgres_data:
  nexaops_mongodb_data: