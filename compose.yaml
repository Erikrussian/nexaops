services:
  mongodb:
    image: mongo:8.0
    container_name: nexaops-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: local_password
    volumes:
      - nexaops_mongodb_data:/data/db

volumes:
  nexaops_mongodb_data: